name: Update PR status table

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch open PRs and rebuild table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query GitHub's search API for PRs you've authored in the last year,
          # sorted newest-first, capped at 20 results (whichever is smaller).
          ONE_YEAR_AGO=$(date -u -d '1 year ago' +%Y-%m-%d)
          QUERY="is:pr author:bferd created:>=${ONE_YEAR_AGO}"
          RESULTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$QUERY")&sort=created&order=desc&per_page=20")

          {
            echo "| PR | Status |"
            echo "|---|---|"
            echo "$RESULTS" | python3 -c '
import json, sys
data = json.load(sys.stdin)
for item in data.get("items", []):
    repo = item["repository_url"].split("/repos/")[1]
    num = item["number"]
    title = item["title"].replace("|", "\\|")
    url = item["html_url"]
    print(f"| [{repo}#{num} \u2013 {title}]({url}) | ![PR status](https://img.shields.io/github/pulls/detail/state/{repo}/{num}) |")
'
          } > /tmp/pr_table.md

          # Replace everything between the markers with the freshly built table.
          python3 - <<'PYEOF'
import re

with open("README.md", "r") as f:
    readme = f.read()

with open("/tmp/pr_table.md", "r") as f:
    table = f.read()

new_block = f"<!-- PR-STATUS:START -->\n{table}<!-- PR-STATUS:END -->"
updated = re.sub(
    r"<!-- PR-STATUS:START -->.*?<!-- PR-STATUS:END -->",
    new_block,
    readme,
    flags=re.DOTALL,
)

with open("README.md", "w") as f:
    f.write(updated)
PYEOF

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: auto-update PR status table"
          git push
